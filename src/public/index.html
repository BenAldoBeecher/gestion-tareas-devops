<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Tareas - To-Do App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 30px;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #1a73e8;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .form {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .form input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form input:focus {
      outline: none;
      border-color: #1a73e8;
    }
    .form button {
      padding: 12px 20px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
    }
    .form button:hover { background: #1557b0; }
    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .task.completed { opacity: 0.6; }
    .task.completed .title { text-decoration: line-through; }
    .task .title { flex: 1; font-size: 1rem; }
    .task button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gestión de Tareas</h1>
    <p class="subtitle">To-Do App · DevOps</p>

    <div class="form">
      <input type="text" id="title" placeholder="Nueva tarea..." />
      <button onclick="addTask()">Agregar</button>
    </div>

    <div id="tasks"></div>
  </div>

  <script>
    const API = '/api/tasks';

    async function loadTasks() {
      const res = await fetch(API);
      const tasks = await res.json();
      const container = document.getElementById('tasks');

      if (!tasks.length) {
        container.innerHTML = '<p class="empty">No hay tareas todavía</p>';
        return;
      }

      container.innerHTML = tasks.map(t => `
        <div class="task ${t.completed ? 'completed' : ''}">
          <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id}, '${t.title.replace(/'/g, "\\'")}', '${(t.description||'').replace(/'/g, "\\'")}', this.checked)">
          <span class="title">${t.title}</span>
          <button onclick="deleteTask(${t.id})" title="Eliminar">🗑️</button>
        </div>
      `).join('');
    }

    async function addTask() {
      const input = document.getElementById('title');
      const title = input.value.trim();
      if (!title) return;

      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });

      input.value = '';
      loadTasks();
    }

    async function toggleTask(id, title, description, completed) {
      await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, completed })
      });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    document.getElementById('title').addEventListener('keypress', e => {
      if (e.key === 'Enter') addTask();
    });

    loadTasks();
  </script>
</body>
</html>
